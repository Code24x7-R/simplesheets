appId: au.mouseclick.simplesheets
productName: SimpleSheets
copyright: Copyright (c) 2026 Richard Robertson

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - '!node_modules/**/*'

asar: true
npmRebuild: false
publish: null

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  perMachine: false
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SimpleSheets
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}.${ext}

portable:
  artifactName: ${productName}-Portable-${version}.${ext}

fileAssociations:
  - ext: ssjson
    name: SimpleSheets Document
    description: SimpleSheets spreadsheet document
    role: Editor
    icon: build/icon.ico
